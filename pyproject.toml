[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skopos"
version = "1.3.1"
description = "Social media lead generation tool"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
skopos = "skopos.cli:main"

[tool.setuptools]
packages = ["skopos", "skopos.scrapers"]

# ponytail: requirements.txt stays the single dependency list; pyproject reads it.
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
